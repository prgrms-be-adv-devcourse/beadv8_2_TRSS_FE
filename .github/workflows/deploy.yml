# develop에 push(머지)되면 프론트를 빌드해서 개발 서버(EC2)의 ~/palette-web에 올린다.
# 서버의 nginx(백엔드 레포 compose.prod.yaml)가 이 폴더의 파일을 그대로 보여 주므로 재시작은 필요 없다.
#
# 프론트 배포 전용 키로 rsync만 한다. 서버의 authorized_keys가 이 키를 rrsync로 묶어 두어서
# (~/palette-web 안에 파일 올리기만 가능), 키가 유출돼도 다른 명령은 실행할 수 없다.
#
# 필요한 Secrets: EC2_HOST, EC2_USER, EC2_KNOWN_HOSTS(서버 지문), WEB_DEPLOY_SSH_KEY(프론트 배포 전용 비밀키)
name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:   # Actions 탭에서 수동 재배포

permissions:
  contents: read

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않고 다음 배포가 기다린다.
concurrency:
  group: deploy-dev-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # VITE_ 환경변수는 빌드할 때 JS 안에 들어간다. 커밋된 .env(토스 테스트 키)를 그대로 쓰고,
      # VITE_API_URL은 비워 둔다(같은 주소의 nginx가 /api를 백엔드로 넘긴다).
      - name: Build
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버 지문을 미리 고정해, 접속한 서버가 진짜 우리 서버인지 확인한다.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # --delay-updates: 새 파일을 다 받은 뒤 한꺼번에 바꿔서, 올리는 도중에 화면이 깨지지 않게 한다.
      # --delete: 이전 빌드에서 남은 파일(예전 해시의 JS·CSS)을 지운다.
      # 받는 경로는 rrsync가 ~/palette-web으로 고정하므로 여기서는 그 안의 최상위(/)를 가리킨다.
      - name: Upload to dev server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -rtz --delete --delay-updates \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            dist/ "$EC2_USER@$EC2_HOST:/"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
